<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exchange Rate Monitor Console</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Exchange Rate Monitor</p>
        <h1>汇率监控控制台</h1>
      </section>

      <section class="panel">
        <div class="row split">
          <div>
            <h2>监控开关</h2>
            <p class="muted">关闭后 GitHub Actions 仍会运行，但不会执行提醒规则。</p>
          </div>
          <label class="toggle">
            <input id="enabled" type="checkbox">
            <span>启用监控</span>
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>提醒邮箱</h2>
        <div id="emails" class="email-list"></div>
        <div class="row actions">
          <button id="addEmail" class="button secondary" type="button">+ 添加邮箱</button>
        </div>
      </section>

      <section class="panel">
        <div class="row split">
          <div>
            <h2>监控规则</h2>
            <p class="muted">支持多个货币规则，每条规则可单独启停。</p>
          </div>
          <button id="addRule" class="button secondary">添加规则</button>
        </div>
        <div id="rules" class="rule-list"></div>
        <div class="rule-help">
          <p><strong>参数说明</strong></p>
          <p><strong>启用</strong>：控制这一条规则是否生效，关闭后不会参与监控。</p>
          <p><strong>货币</strong>：选择要监控的币种，例如英镑、日元、美元。</p>
          <p><strong>字段</strong>：选择监控中国银行牌价里的哪一项，现汇买入价表示银行买入该外币的价格，现汇卖出价表示银行卖出该外币的价格。</p>
          <p><strong>条件</strong>：选择触发提醒的比较方式，大于表示高于阈值提醒，小于表示低于阈值提醒。</p>
          <p><strong>阈值</strong>：填写你希望触发提醒的目标价格。</p>
        </div>
      </section>

      <section class="panel">
        <div class="row actions">
          <button id="saveConfig" class="button primary">保存配置</button>
          <span id="status" class="status">等待操作</span>
        </div>
      </section>
    </main>

    <template id="ruleTemplate">
      <article class="rule-card">
        <div class="grid four">
          <label>
            <span>启用</span>
            <select data-field="enabled">
              <option value="true">开启</option>
              <option value="false">关闭</option>
            </select>
          </label>
          <label>
            <span>货币</span>
            <select data-field="currency"></select>
          </label>
          <label>
            <span>字段</span>
            <select data-field="field">
              <option value="buy">现汇买入价</option>
              <option value="sell">现汇卖出价</option>
            </select>
          </label>
          <label>
            <span>条件</span>
            <select data-field="operator">
              <option value="gt">大于</option>
              <option value="lt">小于</option>
            </select>
          </label>
        </div>
        <div class="grid two">
          <label>
            <span>阈值</span>
            <input data-field="threshold" type="number" step="0.0001" placeholder="例如 930">
          </label>
          <div class="rule-actions">
            <button type="button" class="button danger" data-action="remove">删除规则</button>
          </div>
        </div>
      </article>
    </template>

    <template id="emailTemplate">
      <div class="email-row">
        <input data-field="email" type="email" placeholder="example@gmail.com">
        <button type="button" class="button danger" data-action="remove-email">删除</button>
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
