name: Multi-Currency Rate Monitor

on:
  # 定时运行 - 周一至周五，北京时间 9:00-17:00，每10分钟检查一次
  # GitHub Actions 使用 UTC 时间，北京时间 = UTC + 8
  # 北京时间 9:00-17:00 = UTC 1:00-9:00
  schedule:
    - cron: '*/10 1-9 * * 1-5'
  
  # 手动触发
  workflow_dispatch:

jobs:
  check-rate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          # 英镑阈值
          GBP_BUY_THRESHOLD: ${{ vars.GBP_BUY_THRESHOLD || '940' }}
          GBP_SELL_THRESHOLD: ${{ vars.GBP_SELL_THRESHOLD || '930' }}
          # 日元阈值（卖出价低于此值提醒）
          JPY_SELL_THRESHOLD: ${{ vars.JPY_SELL_THRESHOLD || '5.0' }}
        run: python monitor_action.py
